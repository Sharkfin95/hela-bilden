name: Uppdatera nyheter

on:
  schedule:
    - cron: "3-59/10 * * * *"   # var 10:e minut (:03, :13, :23 …), inte på hel timme då GitHub är som mest belastat
  workflow_dispatch:              # kör manuellt från fliken Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# En körning i taget. En pågående körning avbryts inte – nästa väntar i kö tills den är klar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    timeout-minutes: 10           # hänger något avbryts körningen, i stället för att blockera kön i timmar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser==6.0.11
      - run: python scripts/fetch_news.py --sources sources.json --out site/news.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicera:
    needs: bygg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
